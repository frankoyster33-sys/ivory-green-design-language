<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="960" viewBox="0 0 1440 960" role="img" aria-labelledby="title desc">
  <title id="title">A simple editorial design process</title>
  <desc id="desc">Editable conceptual diagram with three sequential stages: clarify the message, arrange the hierarchy, and refine the details. Each stage has a distinct numbered label and an abstract visual. This diagram has no quantitative scale.</desc>
  <defs>
    <style>
      .serif { font-family: Georgia, "Songti SC", "Noto Serif CJK SC", serif; font-weight: 400; }
      .sans { font-family: Arial, "PingFang SC", "Microsoft YaHei", sans-serif; }
    </style>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1L8 5L1 9" fill="none" stroke="#006442" stroke-width="1.5"/></marker>
  </defs>
  <g id="background"><rect width="1440" height="960" fill="#FFFFFF"/></g>
  <g id="heading">
    <text x="88" y="102" class="sans" fill="#006442" font-size="16" font-weight="700" letter-spacing="2.5">FROM MESSAGE TO FORM</text>
    <text x="84" y="183" class="serif" fill="#134436" font-size="60" letter-spacing="-1.6">Clarity is a sequence of choices.</text>
    <text x="89" y="236" class="sans" fill="#50665C" font-size="25">A conceptual workflow for an intentional, readable composition.</text>
    <path d="M88 276H1352" stroke="#D7DFD3"/>
  </g>
  <g id="sequence-connectors" stroke="#006442" stroke-width="2" fill="none" marker-end="url(#arrow)">
    <path d="M432 484H552"/>
    <path d="M872 484H992"/>
  </g>
  <g id="stage-1">
    <circle cx="280" cy="484" r="138" fill="#F9F4EC"/>
    <circle cx="280" cy="484" r="75" fill="none" stroke="#006442" stroke-width="2"/>
    <circle cx="280" cy="484" r="35" fill="#134436"/>
    <circle cx="280" cy="484" r="8" fill="#FFE552"/>
    <text x="88" y="690" class="serif" fill="#006442" font-size="35">01</text>
    <text x="150" y="690" class="sans" fill="#203D34" font-size="29" font-weight="700">Clarify</text>
    <text x="88" y="742" class="sans" fill="#50665C" font-size="23">State the main message.</text>
    <text x="88" y="779" class="sans" fill="#50665C" font-size="23">Choose what deserves focus.</text>
  </g>
  <g id="stage-2">
    <circle cx="720" cy="484" r="138" fill="#F9F4EC"/>
    <rect x="640" y="416" width="160" height="25" rx="2" fill="#134436"/>
    <rect x="640" y="464" width="123" height="15" rx="2" fill="#006442"/>
    <path d="M640 514H800M640 538H800M640 562H748" stroke="#50665C" stroke-width="3"/>
    <text x="528" y="690" class="serif" fill="#006442" font-size="35">02</text>
    <text x="590" y="690" class="sans" fill="#203D34" font-size="29" font-weight="700">Arrange</text>
    <text x="528" y="742" class="sans" fill="#50665C" font-size="23">Build a visible hierarchy.</text>
    <text x="528" y="779" class="sans" fill="#50665C" font-size="23">Group related information.</text>
  </g>
  <g id="stage-3">
    <circle cx="1160" cy="484" r="138" fill="#F9F4EC"/>
    <path d="M1080 417H1240M1080 551H1240M1093 404V564M1227 404V564" stroke="#D7DFD3" stroke-width="2"/>
    <rect x="1109" y="433" width="102" height="102" rx="2" fill="#134436"/>
    <path d="M1138 484L1154 500L1185 469" stroke="#F9F4EC" stroke-width="5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="1211" cy="433" r="10" fill="#FFE552"/>
    <text x="968" y="690" class="serif" fill="#006442" font-size="35">03</text>
    <text x="1030" y="690" class="sans" fill="#203D34" font-size="29" font-weight="700">Refine</text>
    <text x="968" y="742" class="sans" fill="#50665C" font-size="23">Check spacing and contrast.</text>
    <text x="968" y="779" class="sans" fill="#50665C" font-size="23">Review the final output.</text>
  </g>
  <g id="footer">
    <path d="M88 850H1352" stroke="#D7DFD3"/>
    <text x="88" y="903" class="sans" fill="#50665C" font-size="17">CONCEPTUAL PROCESS · NO QUANTITATIVE SCALE</text>
    <text x="1352" y="903" class="sans" fill="#50665C" font-size="17" text-anchor="end">IVORY GREEN</text>
  </g>
</svg>
